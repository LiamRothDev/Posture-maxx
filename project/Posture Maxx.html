let tweakState = { ...TWEAK_DEFAULTS };
const tweakListeners = new Set();
function setTweak(k, v) {
  tweakState = { ...tweakState, [k]: v };
  tweakListeners.forEach(fn => fn(tweakState));
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
}
function useTweaks() {
  const [t, setT] = React.useState(tweakState);
  React.useEffect(() => { tweakListeners.add(setT); return () => tweakListeners.delete(setT); }, []);
  return t;
}

// ── Confetti ──────────────────────────────────────────────────
function Confetti() {
  const pieces = Array.from({length:30},(_,i)=>i);
  return (
    <div style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden',zIndex:100}}>
      {pieces.map(i=>{
        const colors=['#22c55e','#86efac','#eab308','#f97316','#fff','#60a5fa'];
        const c=colors[i%colors.length];
        const left=`${Math.random()*100}%`;
        const delay=`${Math.random()*0.8}s`;
        const dur=`${1+Math.random()}s`;
        return <div key={i} style={{
          position:'absolute',top:'-10px',left,width:6,height:12,
          background:c,borderRadius:2,opacity:0,
          animation:`confettiFall ${dur} ${delay} ease-in forwards`,
          transform:`rotate(${Math.random()*360}deg)`,
        }}/>;
      })}
      <style>{`
        @keyframes confettiFall {
          0%{opacity:1;transform:translateY(0) rotate(0deg);}
          100%{opacity:0;transform:translateY(900px) rotate(${Math.random()*720}deg);}
        }
      `}</style>
    </div>
  );
}

// ── Animated counter ─────────────────────────────────────────
function AnimCounter({ target, duration=1200, style={} }) {
  const [val, setVal] = React.useState('?');
  React.useEffect(() => {
    const letters = ['F','D','C','B','A'];
    const ti = letters.indexOf(target);
    if (ti < 0) { setVal(target); return; }
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const i = Math.floor(p * ti);
      setVal(letters[i]);
      if (p < 1) requestAnimationFrame(step);
      else setVal(target);
    };
    requestAnimationFrame(step);
  }, [target]);
  return <span style={style}>{val}</span>;
}

    const t = setInterval(()=>{
      setCountdown(prev=>{
        if(prev<=1){ clearInterval(t); setCaptured(true); return null; }
        return prev-1;
      });

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden',background:'#000'}}>

          <div style={{fontSize:11,color:'rgba(255,255,255,0.6)'}}>{captured?'AUFGENOMMEN':'LIVE'}</div>

        {/* weekly */}
        <div onClick={()=>setSelected('week')} style={{
          borderRadius:16,padding:'14px 16px',cursor:'pointer',
          background: selected==='week' ? 'rgba(34,197,94,0.12)' : 'rgba(255,255,255,0.04)',

              <div style={{color:'#fff',fontWeight:600,fontSize:15}}>Wöchentlich</div>
              <div style={{color:'rgba(255,255,255,0.4)',fontSize:12}}>{c.pay_trial}</div>
            </div>
            <div style={{fontFamily:'Bebas Neue',fontSize:22,color:selected==='week'?'#22c55e':'rgba(255,255,255,0.6)'}}>{c.pay_weekly}</div>
          </div>
        </div>

        {/* CTA */}
        <div style={{paddingBottom:8}}>
          <button style={{
            width:'100%',height:56,borderRadius:16,border:'none',cursor:'pointer',
            background:'linear-gradient(135deg,#22c55e,#16a34a)',
            color:'#fff',fontFamily:'DM Sans',fontWeight:700,fontSize:17,
            boxShadow:'0 4px 24px rgba(34,197,94,0.35)',marginBottom:10,
          }}>{c.pay_trial} — dann {selected==='year'?c.pay_yearly:c.pay_weekly}</button>

          <div style={{color:'rgba(255,255,255,0.25)',fontSize:10,textAlign:'center',lineHeight:1.5,padding:'0 8px'}}>
            {c.pay_legal}
          </div>
          <div style={{textAlign:'center',marginTop:8}}>
            <button style={{background:'none',border:'none',color:'rgba(255,255,255,0.3)',fontFamily:'DM Sans',fontSize:12,cursor:'pointer'}}>
              {c.pay_restore}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════
const SCREENS = ['splash','problem','howto','personalize','camguide','scan','results','paywall'];

function App() {
  const [screen, setScreen] = React.useState(() => {
    try { return localStorage.getItem('pm_screen') || 'splash'; } catch { return 'splash'; }
  });
  const tweaks = useTweaks();

  React.useEffect(() => {
    try { localStorage.setItem('pm_screen', screen); } catch {}
  }, [screen]);

  const bg = BG_COLORS[tweaks.bg] || BG_COLORS.dark;
  const c = copy[tweaks.lang] || copy.de;
  const next = () => {
    const i = SCREENS.indexOf(screen);
    if (i < SCREENS.length-1) setScreen(SCREENS[i+1]);
  };

  const screenProps = { onNext: next, c, bg, tweaks };

  const renderScreen = () => {
    switch(screen) {
      case 'splash':      return <ScreenSplash {...screenProps}/>;
      case 'problem':     return <ScreenProblem {...screenProps}/>;
      case 'howto':       return <ScreenHowItWorks {...screenProps}/>;
      case 'personalize': return <ScreenPersonalize {...screenProps}/>;
      case 'camguide':    return <ScreenCameraGuide {...screenProps}/>;
      case 'scan':        return <ScreenScan {...screenProps}/>;
      case 'results':     return <ScreenResults {...screenProps}/>;
      case 'paywall':     return <ScreenPaywall {...screenProps}/>;
      default:            return <ScreenSplash {...screenProps}/>;
    }
  };

  const idx = SCREENS.indexOf(screen);

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
      {/* phone */}
      <IOSDevice dark width={390} height={844}>
        <div style={{height:'100%',overflow:'hidden'}} key={screen}>
          {renderScreen()}
        </div>
      </IOSDevice>

      {/* progress dots */}
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        {SCREENS.map((s,i)=>(
          <div key={s} onClick={()=>setScreen(s)} style={{
            width: i===idx?24:8, height:8, borderRadius:4,
            background: i===idx?'#22c55e' : i<idx ? 'rgba(34,197,94,0.4)' : 'rgba(255,255,255,0.15)',
            cursor:'pointer', transition:'all 0.3s ease',
          }}/>
        ))}
      </div>

      {/* screen label */}
      <div style={{color:'rgba(255,255,255,0.25)',fontFamily:'DM Sans',fontSize:12,letterSpacing:1,textTransform:'uppercase'}}>
        {idx+1} / {SCREENS.length} — {screen}
      </div>
    </div>
  );
}

// ── Tweaks wiring ─────────────────────────────────────────────
window.addEventListener('message', e => {
  if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').style.display = 'block';
  if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').style.display = 'none';
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');

// bind DOM controls
window.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  if ($('tw-lang')) $('tw-lang').addEventListener('change', e => setTweak('lang', e.target.value));
  if ($('tw-bg')) $('tw-bg').addEventListener('change', e => setTweak('bg', e.target.value));
  if ($('tw-score')) $('tw-score').addEventListener('change', e => setTweak('scoreStyle', e.target.value));
  const tog = (id, key) => {
    const el = $(id);
    if (!el) return;
    el.addEventListener('click', () => {
      el.classList.toggle('on');
      setTweak(key, el.classList.contains('on'));
    });
  };
  tog('tw-confetti','confetti');
  tog('tw-anim','animCounter');
});

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
