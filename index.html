// ══════════════════════════════════════════════════════════════
// PoseAnalyzer — thin wrapper around @mediapipe/tasks-vision.
// Signature matches the RN-side implementation so the UI and
// calculateScores() below stay untouched when porting.
//   analyzer.init()          -> Promise<void>
//   analyzer.analyze(image)  -> Promise<Landmark[] | null>
//   analyzer.dispose()       -> void
// A Landmark is { x, y, z, visibility } with x,y normalized [0..1].
// ══════════════════════════════════════════════════════════════
function createPoseAnalyzer() {
  let landmarker = null;
  let loading = null;
  return {
    async init() {
      if (landmarker) return;
      if (!loading) loading = (async () => {
        const mod = await import('./vendor/tasks-vision.mjs');
        const { FilesetResolver, PoseLandmarker } = mod;
        const fileset = await FilesetResolver.forVisionTasks('./vendor/wasm');
        landmarker = await PoseLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: './vendor/pose_landmarker_lite.task', delegate: 'GPU' },
          runningMode: 'IMAGE',
          numPoses: 1,
        });
      })();
      return loading;
    },
    async analyze(imageLike) {
      if (!landmarker) await this.init();
      const res = landmarker.detect(imageLike);
      const pts = res?.landmarks?.[0];
      return pts && pts.length === 33 ? pts : null;
    },
    dispose() {
      if (landmarker) { landmarker.close(); landmarker = null; loading = null; }
    },
  };
}

// ══════════════════════════════════════════════════════════════
// calculateScores — pure function, no DOM / React.
// Portable 1:1 to React Native (MediaPipe native uses same schema).
// Input : { side, front, back } each = Landmark[] | null
// Output: { overall: 'A'..'F', zones: [{key, score, angleDeg}, ...] }
// ══════════════════════════════════════════════════════════════
const LM = { NOSE:0, LEFT_EAR:7, RIGHT_EAR:8, LEFT_SHOULDER:11, RIGHT_SHOULDER:12,
             LEFT_HIP:23, RIGHT_HIP:24, LEFT_KNEE:25, RIGHT_KNEE:26,
             LEFT_ANKLE:27, RIGHT_ANKLE:28 };

function _visible(p, t=0.3) { return p && (p.visibility ?? 1) >= t; }
function _mid(a, b) { return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }
function _angleFromVertical(a, b) {
  // returns absolute degrees between line a->b and vertical
  const dx = b.x - a.x, dy = b.y - a.y;
  return Math.abs(Math.atan2(Math.abs(dx), Math.abs(dy)) * 180 / Math.PI);
}
function _angleAt(a, b, c) {
  // angle at b between ba and bc (degrees)
  const v1 = { x:a.x-b.x, y:a.y-b.y };
  const v2 = { x:c.x-b.x, y:c.y-b.y };
  const dot = v1.x*v2.x + v1.y*v2.y;
  const m1 = Math.hypot(v1.x, v1.y), m2 = Math.hypot(v2.x, v2.y);
  if (!m1 || !m2) return 180;
  return Math.acos(Math.max(-1, Math.min(1, dot/(m1*m2)))) * 180 / Math.PI;
}
function _gradeFromBands(val, bands) {
  // bands = [A_max, B_max, C_max, D_max] ascending; above D_max => F
  if (val == null || isNaN(val)) return null;
  const [a,b,c,d] = bands;
  if (val < a) return 'A';
  if (val < b) return 'B';
  if (val < c) return 'C';
  if (val < d) return 'D';
  return 'F';
}
function _median(arr) {
  const xs = arr.filter(x => x != null).slice().sort();
  if (!xs.length) return 'C';
  return xs[Math.floor(xs.length/2)];
}

function calculateScores({ side, front, back }) {
  const zones = [];

  // 1. Head Forward — side view: ear to shoulder vs vertical
  let headAngle = null, headGrade = null;
  if (side) {
    const ear = _visible(side[LM.LEFT_EAR]) ? side[LM.LEFT_EAR]
              : _visible(side[LM.RIGHT_EAR]) ? side[LM.RIGHT_EAR] : null;
    const shoulder = _visible(side[LM.LEFT_SHOULDER]) ? side[LM.LEFT_SHOULDER]
                   : _visible(side[LM.RIGHT_SHOULDER]) ? side[LM.RIGHT_SHOULDER] : null;
    if (ear && shoulder) {
      headAngle = _angleFromVertical(shoulder, ear);
      headGrade = _gradeFromBands(headAngle, [5, 10, 15, 20]);
    }
  }
  zones.push({ key:'head', score: headGrade, angleDeg: headAngle });

  // 2. Shoulders — front view: height diff / shoulder width (as %)
  let shDiff = null, shGrade = null;
  if (front) {
    const l = front[LM.LEFT_SHOULDER], r = front[LM.RIGHT_SHOULDER];
    if (_visible(l) && _visible(r)) {
      const width = Math.abs(l.x - r.x);
      if (width > 0.02) {
        shDiff = Math.abs(l.y - r.y) / width * 100;
        shGrade = _gradeFromBands(shDiff, [1.5, 3, 5, 8]);
      }
    }
  }
  zones.push({ key:'shoulders', score: shGrade, angleDeg: shDiff });

  // 3. Spine — back view: shoulder-mid to hip-mid vs vertical
  let spAngle = null, spGrade = null;
  if (back) {
    const ls = back[LM.LEFT_SHOULDER], rs = back[LM.RIGHT_SHOULDER];
    const lh = back[LM.LEFT_HIP], rh = back[LM.RIGHT_HIP];
    if (_visible(ls) && _visible(rs) && _visible(lh) && _visible(rh)) {
      spAngle = _angleFromVertical(_mid(lh,rh), _mid(ls,rs));
      spGrade = _gradeFromBands(spAngle, [3, 6, 10, 15]);
    }
  }
  zones.push({ key:'spine', score: spGrade, angleDeg: spAngle });

  // 4. Pelvis — front view: left/right hip height diff / hip width (%)
  let pvDiff = null, pvGrade = null;
  if (front) {
    const l = front[LM.LEFT_HIP], r = front[LM.RIGHT_HIP];
    if (_visible(l) && _visible(r)) {
      const width = Math.abs(l.x - r.x);
      if (width > 0.02) {
        pvDiff = Math.abs(l.y - r.y) / width * 100;
        pvGrade = _gradeFromBands(pvDiff, [1, 2, 4, 7]);
      }
    }
  }
  zones.push({ key:'pelvis', score: pvGrade, angleDeg: pvDiff });

  // 5. Knee axis — side view: hip-knee-ankle, deviation from 180°
  let knAngle = null, knGrade = null;
  if (side) {
    const hip = _visible(side[LM.LEFT_HIP]) ? side[LM.LEFT_HIP]
              : _visible(side[LM.RIGHT_HIP]) ? side[LM.RIGHT_HIP] : null;
    const knee = _visible(side[LM.LEFT_KNEE]) ? side[LM.LEFT_KNEE]
               : _visible(side[LM.RIGHT_KNEE]) ? side[LM.RIGHT_KNEE] : null;
    const ankle = _visible(side[LM.LEFT_ANKLE]) ? side[LM.LEFT_ANKLE]
                : _visible(side[LM.RIGHT_ANKLE]) ? side[LM.RIGHT_ANKLE] : null;
    if (hip && knee && ankle) {
      knAngle = Math.abs(180 - _angleAt(hip, knee, ankle));
      knGrade = _gradeFromBands(knAngle, [5, 10, 15, 20]);
    }
  }
  zones.push({ key:'knees', score: knGrade, angleDeg: knAngle });

  const overall = _median(zones.map(z => z.score));
  return { overall, zones };
}

function SilhouetteGuide({ pose = 'side' }) {
  // three variants — differ in arm position and facial hint
  const arms = pose === 'front'
    ? { l: "M46 52 L28 130 L30 170", r: "M74 52 L92 130 L90 170" }  // abgespreizt
    : pose === 'back'
      ? { l: "M46 52 L42 170", r: "M74 52 L78 170" }                 // am Körper, leicht nach aussen
      : { l: "M56 52 L54 170", r: "M64 52 L66 170" };                // seitlich, deckend
  return (
    <svg viewBox="0 0 120 300" width={120} height={300} fill="none">
      <ellipse cx={60} cy={25} rx={14} ry={16} stroke="#22c55e" strokeWidth={1.5} strokeDasharray="4 3" fill="rgba(34,197,94,0.05)"/>
      {/* face hint only on front */}
      {pose === 'front' && (
        <g stroke="#22c55e" strokeWidth={1} opacity={0.5}>
          <circle cx={55} cy={23} r={1} fill="#22c55e"/>
          <circle cx={65} cy={23} r={1} fill="#22c55e"/>
          <path d="M55 30 Q60 33 65 30"/>
        </g>
      )}
      {/* torso */}
      <path d="M46 42 Q40 80 42 130 Q40 160 44 190 Q46 220 48 280" stroke="#22c55e" strokeWidth={14} strokeLinecap="round" opacity={0.1} fill="none"/>
      <path d="M74 42 Q80 80 78 130 Q80 160 76 190 Q74 220 72 280" stroke="#22c55e" strokeWidth={14} strokeLinecap="round" opacity={0.1} fill="none"/>
      <path d="M46 42 Q40 80 42 130 Q40 160 44 190 Q46 220 48 280" stroke="#22c55e" strokeWidth={1.5} strokeLinecap="round" strokeDasharray="5 4" fill="none"/>
      <path d="M74 42 Q80 80 78 130 Q80 160 76 190 Q74 220 72 280" stroke="#22c55e" strokeWidth={1.5} strokeLinecap="round" strokeDasharray="5 4" fill="none"/>
      {/* arms */}
      <path d={arms.l} stroke="#22c55e" strokeWidth={1.5} strokeLinecap="round" strokeDasharray="5 4" fill="none" opacity={0.8}/>
      <path d={arms.r} stroke="#22c55e" strokeWidth={1.5} strokeLinecap="round" strokeDasharray="5 4" fill="none" opacity={0.8}/>
      {/* shoulder/hip reference lines — only on front/back */}
      {pose !== 'side' && (
        <>
          <line x1={40} y1={60} x2={80} y2={62} stroke="#86efac" strokeWidth={1} strokeDasharray="3 3"/>
          <line x1={40} y1={145} x2={80} y2={145} stroke="#86efac" strokeWidth={1} strokeDasharray="3 3"/>
        </>
      )}
      {/* corner markers */}
      {[[60,9],[60,275],[35,40],[85,40],[35,278],[85,278]].map(([x,y],i)=>(
        <rect key={i} x={x-4} y={y-4} width={8} height={8}
          stroke="#22c55e" strokeWidth={1.5} fill="transparent"
          transform={`rotate(45,${x},${y})`} opacity={0.8}/>
      ))}
    </svg>
  );
}

    <div style={{width:'100%',height:'100%',background:bg,display:'flex',flexDirection:'column',padding:'80px 24px 40px',overflow:'hidden'}}>
      <div style={{fontFamily:'Bebas Neue',fontSize:38,color:'#fff',letterSpacing:1,marginBottom:6}}>{c.ob3_title}</div>

          width:'100%',height:52,borderRadius:14,
          background:'rgba(255,255,255,0.06)',

      <div style={{color:'rgba(255,255,255,0.45)',fontSize:13,textTransform:'uppercase',letterSpacing:1,marginBottom:14}}>
        {c.ob3_goal}
      </div>

      <div style={{flex:1,display:'flex',flexDirection:'column',gap:10,overflowY:'auto'}}>
        {c.ob3_goals.map((g,i)=>(
          <div key={i} onClick={()=>setGoal(i)} style={{
            height:52,borderRadius:14,
            background: goal===i ? 'rgba(34,197,94,0.15)' : 'rgba(255,255,255,0.04)',

            <div style={{
              width:20,height:20,borderRadius:'50%',
              border:`2px solid ${goal===i ? '#22c55e' : 'rgba(255,255,255,0.2)'}`,
              background: goal===i ? '#22c55e' : 'transparent',

        }}>{c.cam_cta} →</button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// Confetti (pre-computed random so rerenders are stable)
// ══════════════════════════════════════════════════════════════
function Confetti() {
  const pieces = React.useMemo(() => {
    const colors = ['#22c55e','#86efac','#eab308','#f97316','#fff','#60a5fa'];
    return Array.from({length: 30}, (_, i) => ({
      color: colors[i % colors.length],
      left: Math.random() * 100,
      delay: Math.random() * 0.8,
      dur: 1 + Math.random(),
      rot: Math.random() * 360,
      endRot: Math.random() * 720,
    }));
  }, []);

  return (
    <div style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden',zIndex:100}}>
      {pieces.map((p, i) => (
        <div key={i} style={{
          position:'absolute',top:'-10px',left:`${p.left}%`,width:6,height:12,
          background:p.color,borderRadius:2,opacity:0,
          animation:`confettiFall ${p.dur}s ${p.delay}s ease-in forwards`,
          transform:`rotate(${p.rot}deg)`,
          '--end-rot': `${p.endRot}deg`,
        }}/>
      ))}
      <style>{`
        @keyframes confettiFall {
          0% { opacity: 1; transform: translateY(0) rotate(0deg); }
          100% { opacity: 0; transform: translateY(900px) rotate(720deg); }
        }
      `}</style>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// Animated letter-grade counter (F → D → C → B → A)
// ══════════════════════════════════════════════════════════════
function AnimCounter({ target, duration = 1200, style = {} }) {
  const [val, setVal] = React.useState('?');
  React.useEffect(() => {
    const letters = ['F','D','C','B','A'];
    const ti = letters.indexOf(target);
    if (ti < 0) { setVal(target); return; }
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const i = Math.floor(p * ti);
      setVal(letters[i]);
      if (p < 1) requestAnimationFrame(step);
      else setVal(target);
    };
    requestAnimationFrame(step);
  }, [target, duration]);
  return <span style={style}>{val}</span>;
}

// ══════════════════════════════════════════════════════════════
// Screen 6: Scan (camera with silhouette)
// ══════════════════════════════════════════════════════════════
const STEPS = ['side', 'front', 'back'];

function ScreenScan({ onNext, c, setPhoto }) {
  const [stepIdx, setStepIdx] = React.useState(0);
  const [captured, setCaptured] = React.useState(false);
  const [countdown, setCountdown] = React.useState(null);
  // 'pending' | 'active' | 'denied' | 'unsupported'
  const [camState, setCamState] = React.useState('pending');
  const fileInputRef = React.useRef(null);
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);

  const step = STEPS[stepIdx];
  const isLastStep = stepIdx === STEPS.length - 1;

  React.useEffect(() => {
    let cancelled = false;
    const mediaDevices = navigator.mediaDevices;
    if (!mediaDevices || !mediaDevices.getUserMedia) {
      setCamState('unsupported');
      return;
    }
    mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1920 } }, audio: false })
      .then(stream => {
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
        setCamState('active');
      })
      .catch(() => { if (!cancelled) setCamState('denied'); });
    return () => {
      cancelled = true;
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(t => t.stop());
        streamRef.current = null;
      }
    };
  }, []);

  const captureFromVideo = async () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
    if (blob && setPhoto) {
      const file = new File([blob], `${step}.jpg`, { type: 'image/jpeg' });
      setPhoto(step, file);
    }
  };

  const doCapture = () => {
    if (camState !== 'active') {
      // no live feed — open gallery directly
      fileInputRef.current?.click();
      return;
    }
    setCountdown(3);
    const t = setInterval(() => {
      setCountdown(prev => {
        if (prev <= 1) {
          clearInterval(t);
          captureFromVideo().then(() => setCaptured(true));
          return null;
        }
        return prev - 1;
      });
    }, 700);
  };

  const onPickFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (setPhoto) setPhoto(step, file);
    setCaptured(true);
    e.target.value = '';
  };

  const advance = () => {
    if (isLastStep) {
      onNext();
    } else {
      setStepIdx(i => i + 1);
      setCaptured(false);
    }
  };

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden',background:'#000'}}>
      {/* camera feed fallback gradient */}
      <div style={{
        position:'absolute',inset:0,
        background:'linear-gradient(180deg,#0a0f08 0%,#0f1a0f 50%,#0a0f08 100%)',
      }}/>
      {/* live video (if camera granted) */}
      <video
        ref={videoRef}
        playsInline
        muted
        autoPlay
        style={{
          position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',
          opacity: camState === 'active' ? 1 : 0,
          transition: 'opacity 0.3s ease',
        }}
      />

      {/* grid overlay */}
      <svg style={{position:'absolute',inset:0,opacity:0.15}} width="100%" height="100%">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" strokeWidth="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
      </svg>

      {/* Silhouette overlay */}
      <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{position:'relative'}} key={step}>
          <SilhouetteGuide pose={step}/>
          {step === 'side' && (
            <div style={{
              position:'absolute',right:-30,top:'30%',
              color:'#22c55e',fontSize:28,
              animation:'pulse 1.5s ease-in-out infinite',
            }}>←</div>
          )}
        </div>
      </div>

      {/* scan line */}
      {!captured && (
        <div style={{
          position:'absolute',left:0,right:0,height:2,
          background:'linear-gradient(90deg,transparent,#22c55e,transparent)',
          animation:'scanLine 2s ease-in-out infinite alternate',
          boxShadow:'0 0 12px #22c55e',
        }}/>
      )}

      {/* top HUD */}
      <div style={{position:'absolute',top:80,left:0,right:0,display:'flex',justifyContent:'space-between',padding:'0 20px'}}>
        <div style={{
          background:'rgba(0,0,0,0.6)',backdropFilter:'blur(10px)',
          borderRadius:10,padding:'6px 12px',
          border:'1px solid rgba(34,197,94,0.3)',
        }}>
          <div style={{fontFamily:'Bebas Neue',fontSize:13,color:'#22c55e',letterSpacing:1}}>{c.scan_labels[step]}</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.4)',letterSpacing:0.5}}>{stepIdx+1} / {STEPS.length}</div>
        </div>
        <div style={{
          background:'rgba(0,0,0,0.6)',backdropFilter:'blur(10px)',
          borderRadius:10,padding:'6px 12px',
          border:'1px solid rgba(255,255,255,0.1)',
          display:'flex',alignItems:'center',gap:6,
        }}>
          <div style={{width:8,height:8,borderRadius:'50%',
            background: captured ? '#22c55e' : camState === 'active' ? '#eab308' : '#ef4444',
            boxShadow: `0 0 6px ${captured ? '#22c55e' : camState === 'active' ? '#eab308' : '#ef4444'}`}}/>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.6)'}}>
            {captured ? c.scan_done : camState === 'active' ? c.scan_live : c.scan_offline}
          </div>
        </div>
      </div>

      {/* hint */}
      {!captured && (
        <div style={{position:'absolute',top:'58%',left:0,right:0,display:'flex',justifyContent:'center'}}>
          <div style={{
            background:'rgba(0,0,0,0.7)',backdropFilter:'blur(10px)',
            borderRadius:20,padding:'8px 16px',
            border: `1px solid ${camState === 'active' ? 'rgba(255,255,255,0.1)' : 'rgba(239,68,68,0.35)'}`,
            fontSize:12,color:'rgba(255,255,255,0.7)',
          }}>{camState === 'active' ? c.scan_hints[step] : c.scan_no_cam}</div>
        </div>
      )}

      {/* countdown */}
      {countdown && (
        <div style={{
          position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
          background:'rgba(0,0,0,0.4)',
        }}>
          <div style={{fontFamily:'Bebas Neue',fontSize:120,color:'#22c55e',textShadow:'0 0 40px #22c55e',lineHeight:1}}>
            {countdown}
          </div>
        </div>
      )}

      {/* captured checkmark */}
      {captured && (
        <div style={{
          position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
          background:'rgba(34,197,94,0.15)',
        }}>
          <div style={{
            width:80,height:80,borderRadius:'50%',
            background:'rgba(34,197,94,0.9)',
            display:'flex',alignItems:'center',justifyContent:'center',
            animation:'scaleIn 0.3s ease',
          }}>
            <svg viewBox="0 0 32 32" width={40} height={40} fill="none">
              <path d="M6 16L13 23L26 9" stroke="#0a1a0f" strokeWidth={3} strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
        </div>
      )}

      {/* bottom controls */}
      <div style={{position:'absolute',bottom:50,left:0,right:0,display:'flex',justifyContent:'center',alignItems:'center',gap:20}}>
        {!captured ? (
          <>
            <button onClick={() => fileInputRef.current?.click()} title={c.scan_gallery} style={{
              width:52,height:52,borderRadius:14,border:'1px solid rgba(255,255,255,0.15)',
              background:'rgba(0,0,0,0.6)',backdropFilter:'blur(10px)',cursor:'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',
            }}>
              <svg viewBox="0 0 24 24" width={22} height={22} fill="none" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round">
                <rect x={3} y={5} width={18} height={14} rx={2}/>
                <circle cx={9} cy={11} r={2}/>
                <path d="M21 16l-5-4-9 7"/>
              </svg>
            </button>
            <button onClick={doCapture} style={{
              width:72,height:72,borderRadius:'50%',border:'4px solid #22c55e',
              background:'rgba(34,197,94,0.15)',cursor:'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',
              boxShadow:'0 0 24px rgba(34,197,94,0.4)',
            }}>
              <div style={{width:50,height:50,borderRadius:'50%',background:'#22c55e'}}/>
            </button>
            <div style={{width:52,height:52}}/>{/* spacer to keep shutter centered */}
          </>
        ) : (
          <button onClick={advance} style={{
            height:52,borderRadius:16,border:'none',cursor:'pointer',
            background:'linear-gradient(135deg,#22c55e,#16a34a)',
            color:'#fff',fontFamily:'DM Sans',fontWeight:700,fontSize:16,
            padding:'0 32px',boxShadow:'0 4px 24px rgba(34,197,94,0.4)',
            animation:'fadeUp 0.4s ease',
          }}>{isLastStep ? c.scan_next : c.scan_next_step}</button>
        )}
      </div>

      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        style={{display:'none'}}
        onChange={onPickFile}
      />
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// Screen 6b: Analyzing — loads MediaPipe, runs pose detection
// on each of the 3 captured photos, then writes computedScores.
// ══════════════════════════════════════════════════════════════
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function ScreenAnalyzing({ c, bg, photos, onDone, onError, onRetry }) {
  const [stage, setStage] = React.useState('loading'); // loading | step1 | step2 | step3 | done | error
  const [stepN, setStepN] = React.useState(0);

  React.useEffect(() => {
    let cancelled = false;
    const analyzer = createPoseAnalyzer();
    (async () => {
      try {
        setStage('loading');
        await analyzer.init();
        if (cancelled) return;
        const order = ['side', 'front', 'back'];
        const out = { side:null, front:null, back:null };
        for (let i = 0; i < order.length; i++) {
          const key = order[i];
          const file = photos?.[key];
          if (!file) continue;
          setStepN(i+1);
          setStage('step' + (i+1));
          const img = await loadImageFromFile(file);
          if (cancelled) return;
          out[key] = await analyzer.analyze(img);
        }
        if (cancelled) return;
        if (!out.side && !out.front && !out.back) {
          setStage('error');
          if (onError) onError('no-pose');
          return;
        }
        setStage('done');
        const scores = calculateScores(out);
        if (onDone) onDone({ keypoints: out, scores });
      } catch (e) {
        console.error('[Analyze] failed:', e);
        if (!cancelled) { setStage('error'); if (onError) onError(e); }
      }
    })();
    return () => { cancelled = true; analyzer.dispose(); };
  }, [photos]);

  const labelFor = () => {
    if (stage === 'loading') return c.analyze_loading;
    if (stage === 'done')    return c.analyze_done;
    if (stage === 'error')   return c.analyze_error;
    return c.analyze_step(stepN, 3);
  };

  return (
    <div style={{width:'100%',height:'100%',background:bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 24px',position:'relative'}}>
      {/* pulsing scan ring */}
      <div style={{position:'relative',width:120,height:120,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:32}}>
        <div style={{
          position:'absolute',inset:0,borderRadius:'50%',
          border:'2px solid rgba(34,197,94,0.3)',
          animation: stage === 'error' ? 'none' : 'pulse 1.6s ease-in-out infinite',
        }}/>
        <div style={{
          position:'absolute',inset:10,borderRadius:'50%',
          border:'2px solid rgba(34,197,94,0.15)',
          animation: stage === 'error' ? 'none' : 'pulse 1.6s ease-in-out 0.3s infinite',
        }}/>
        <div style={{fontFamily:'Bebas Neue',fontSize:42,color: stage === 'error' ? '#ef4444' : '#22c55e',lineHeight:1}}>
          {stage === 'error' ? '!' : stage === 'done' ? '✓' : (stepN || '…')}
        </div>
      </div>

      <div style={{fontFamily:'Bebas Neue',fontSize:28,letterSpacing:2,color:'#fff',textAlign:'center'}}>
        {stage === 'error' ? '' : c.analyze_title}
      </div>
      <div style={{fontFamily:'DM Sans',fontSize:13,color:'rgba(255,255,255,0.5)',marginTop:8,marginBottom:24,textAlign:'center',maxWidth:280}}>
        {c.analyze_sub}
      </div>

      <div style={{fontFamily:'DM Sans',fontSize:15,color: stage === 'error' ? '#ef4444' : 'rgba(255,255,255,0.85)',textAlign:'center',maxWidth:300,minHeight:40}}>
        {labelFor()}
      </div>

      {/* progress dots */}
      {stage !== 'error' && (
        <div style={{display:'flex',gap:8,marginTop:20}}>
          {[1,2,3].map(i => (
            <div key={i} style={{
              width:stepN === i ? 20 : 8, height:8, borderRadius:4,
              background: stage === 'done' || stepN > i ? '#22c55e' : stepN === i ? 'rgba(34,197,94,0.8)' : 'rgba(255,255,255,0.15)',
              transition:'all 0.3s ease',
            }}/>
          ))}
        </div>
      )}

      {stage === 'error' && (
        <button onClick={onRetry} style={{
          marginTop:24,height:48,borderRadius:14,border:'none',cursor:'pointer',
          background:'linear-gradient(135deg,#22c55e,#16a34a)',
          color:'#fff',fontFamily:'DM Sans',fontWeight:700,fontSize:15,
          padding:'0 28px',boxShadow:'0 4px 20px rgba(34,197,94,0.35)',
        }}>{c.analyze_retry}</button>
      )}
    </div>
  );
}

// Screen 7: Results
// ══════════════════════════════════════════════════════════════
function ScreenResults({ onNext, c, bg, tweaks, photos, computed }) {
  const [revealed, setRevealed] = React.useState(false);
  const [showConfetti, setShowConfetti] = React.useState(false);

  // Prefer computed (real) scores; fall back to hardcoded copy if user skipped scan.
  const zones = computed?.zones?.length
    ? computed.zones.map(z => ({
        label: c.result_zone_labels[z.key] || z.key,
        score: z.score || 'C',
        angle: z.angleDeg != null
          ? `${z.angleDeg.toFixed(1)}${c.result_unit[z.key] || ''}`
          : '—',
      }))
    : c.result_zones;
  const overallScore = computed?.overall || 'C';

  const photoUrls = React.useMemo(() => {
    const urls = {};
    ['side','front','back'].forEach(k => {
      if (photos?.[k]) urls[k] = URL.createObjectURL(photos[k]);
    });
    return urls;
  }, [photos]);

  React.useEffect(() => () => {
    Object.values(photoUrls).forEach(u => URL.revokeObjectURL(u));
  }, [photoUrls]);

  React.useEffect(() => {
    const t = setTimeout(() => {
      setRevealed(true);
      if (tweaks?.confetti) setShowConfetti(true);

    return () => clearTimeout(t);

  const hasAnyPhoto = photoUrls.side || photoUrls.front || photoUrls.back;

  return (
    <div style={{width:'100%',height:'100%',background:bg,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>

// ══════════════════════════════════════════════════════════════
// App
// ══════════════════════════════════════════════════════════════
const SCREENS = ['splash','problem','howto','personalize','camguide','scan','analyzing','results','paywall'];

function useLocalState(key, defaultVal) {
  const [val, setVal] = React.useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? defaultVal : JSON.parse(raw);
    } catch { return defaultVal; }
  });
  React.useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

function TweaksPanel({ tweaks, setTweaks, open, onClose }) {
  if (!open) return null;
  const set = (k, v) => setTweaks(t => ({ ...t, [k]: v }));

  const Toggle = ({ on, onClick }) => (
    <div onClick={onClick} style={{
      width: 40, height: 22, borderRadius: 11,
      background: on ? '#86efac' : 'rgba(255,255,255,0.15)',
      cursor: 'pointer', position: 'relative', transition: 'background 0.2s',
    }}>
      <div style={{
        position: 'absolute', top: 3, left: 3, width: 16, height: 16,
        borderRadius: '50%', background: 'white',
        transform: on ? 'translateX(18px)' : 'translateX(0)',
        transition: 'transform 0.2s',
      }}/>
    </div>
  );

  const Label = ({ children }) => (
    <label style={{display:'block',color:'rgba(255,255,255,0.5)',marginBottom:6,fontSize:11,textTransform:'uppercase',letterSpacing:0.08*11}}>
      {children}
    </label>
  );

  const selectStyle = {
    width: '100%', background: 'rgba(255,255,255,0.08)',
    border: '1px solid rgba(255,255,255,0.12)',
    borderRadius: 8, color: 'white', padding: '8px 10px',
    fontFamily: 'inherit', fontSize: 13, appearance: 'none',
    marginBottom: 14,
  };

  return (
    <div style={{
      position: 'fixed', bottom: 24, right: 24,
      background: 'rgba(20,20,25,0.95)',
      border: '1px solid rgba(255,255,255,0.12)',
      borderRadius: 16, padding: 20, width: 260, zIndex: 9999,
      backdropFilter: 'blur(20px)', color: 'white',
      fontFamily: 'DM Sans, sans-serif', fontSize: 13,
    }}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <h3 style={{fontSize:14,fontWeight:600,color:'rgba(255,255,255,0.9)',letterSpacing:'0.02em'}}>Tweaks</h3>
        <div onClick={onClose} style={{cursor:'pointer',color:'rgba(255,255,255,0.5)',fontSize:18,lineHeight:1,padding:'0 4px'}}>×</div>
      </div>

      <Label>Sprache / Language</Label>
      <select value={tweaks.lang} onChange={e => set('lang', e.target.value)} style={selectStyle}>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="en">🇬🇧 English</option>
      </select>

      <Label>Hintergrund / Background</Label>
      <select value={tweaks.bg} onChange={e => set('bg', e.target.value)} style={selectStyle}>
        <option value="dark">Pure Black</option>
        <option value="anthracite">Anthrazit</option>
        <option value="navy">Deep Navy</option>
      </select>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <label style={{margin:0,color:'rgba(255,255,255,0.5)',fontSize:11,textTransform:'uppercase',letterSpacing:0.08*11}}>Confetti</label>
        <Toggle on={tweaks.confetti} onClick={() => set('confetti', !tweaks.confetti)}/>
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <label style={{margin:0,color:'rgba(255,255,255,0.5)',fontSize:11,textTransform:'uppercase',letterSpacing:0.08*11}}>Score-Counter</label>
        <Toggle on={tweaks.animCounter} onClick={() => set('animCounter', !tweaks.animCounter)}/>
      </div>
    </div>
  );
}

const DEFAULT_TWEAKS = { lang: 'de', bg: 'dark', confetti: true, animCounter: true };

function App() {
  const [tweaks, setTweaks] = useLocalState('pm_tweaks', DEFAULT_TWEAKS);
  const [screen, setScreen] = useLocalState('pm_screen', 'splash');
  const [panelOpen, setPanelOpen] = React.useState(false);
  const [capturedPhotos, setCapturedPhotos] = React.useState({ side: null, front: null, back: null });
  const [computed, setComputed] = React.useState(null);

  const bg = BG_COLORS[tweaks.bg] || BG_COLORS.dark;
  const c = copy[tweaks.lang] || copy.de;

  const idx = SCREENS.indexOf(screen);
  const next = () => {
    if (idx < SCREENS.length - 1) setScreen(SCREENS[idx + 1]);
  };

  const setPhoto = (step, file) => setCapturedPhotos(p => ({ ...p, [step]: file }));

  const renderScreen = () => {
    switch (screen) {
      case 'splash':      return <ScreenSplash onNext={next} c={c} bg={bg}/>;
      case 'problem':     return <ScreenProblem onNext={next} c={c} bg={bg}/>;
      case 'howto':       return <ScreenHowItWorks onNext={next} c={c} bg={bg}/>;
      case 'personalize': return <ScreenPersonalize onNext={next} c={c} bg={bg}/>;
      case 'camguide':    return <ScreenCameraGuide onNext={next} c={c} bg={bg}/>;
      case 'scan':        return <ScreenScan onNext={next} c={c} setPhoto={setPhoto}/>;
      case 'analyzing':   return <ScreenAnalyzing
                                   c={c} bg={bg} photos={capturedPhotos}
                                   onDone={({ scores }) => { setComputed(scores); setScreen('results'); }}
                                   onRetry={() => setScreen('scan')}
                                 />;
      case 'results':     return <ScreenResults onNext={next} c={c} bg={bg} tweaks={tweaks} photos={capturedPhotos} computed={computed}/>;
      case 'paywall':     return <ScreenPaywall c={c} bg={bg}/>;
      default:            return <ScreenSplash onNext={next} c={c} bg={bg}/>;
    }
  };

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
      <IOSDevice>
        <div style={{height:'100%',overflow:'hidden'}} key={`${screen}-${tweaks.lang}-${tweaks.bg}`}>
          {renderScreen()}
        </div>
      </IOSDevice>

      {/* progress dots */}
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        {SCREENS.map((s, i) => (
          <div key={s} onClick={() => setScreen(s)} style={{
            width: i === idx ? 24 : 8, height: 8, borderRadius: 4,
            background: i === idx ? '#22c55e' : i < idx ? 'rgba(34,197,94,0.4)' : 'rgba(255,255,255,0.15)',
            cursor: 'pointer', transition: 'all 0.3s ease',
          }}/>
        ))}
      </div>

      <div style={{color:'rgba(255,255,255,0.25)',fontFamily:'DM Sans',fontSize:12,letterSpacing:1,textTransform:'uppercase'}}>
        {idx + 1} / {SCREENS.length} — {screen}
      </div>

      {/* Tweaks trigger */}
      <button onClick={() => setPanelOpen(o => !o)} style={{
        position: 'fixed', top: 20, right: 20,
        width: 40, height: 40, borderRadius: 12,
        background: 'rgba(20,20,25,0.9)',
        border: '1px solid rgba(255,255,255,0.12)',
        cursor: 'pointer', color: 'white', zIndex: 9998,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }} title="Tweaks">
        <svg viewBox="0 0 16 16" width={16} height={16} fill="none" stroke="currentColor" strokeWidth={1.5} strokeLinecap="round">
          <line x1={2} y1={4} x2={14} y2={4}/>
          <line x1={2} y1={8} x2={14} y2={8}/>
          <line x1={2} y1={12} x2={14} y2={12}/>
          <circle cx={6} cy={4} r={2} fill="rgba(20,20,25,0.9)"/>
          <circle cx={10} cy={8} r={2} fill="rgba(20,20,25,0.9)"/>
          <circle cx={5} cy={12} r={2} fill="rgba(20,20,25,0.9)"/>
        </svg>
      </button>

      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} open={panelOpen} onClose={() => setPanelOpen(false)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
